# SPIKE (not for main): a FrankenPHP base built once (PHP + the standard
# extension set, no app), then a per-app build that only embeds the app and
# links - under our builders' per-build cap (2 CPUs, 4 GB). Then the binary
# runs the way a deploy would: release command, a worker, the web.
name: spike-frankenphp-static
on:
  push:
    branches: [spike/frankenphp-static]

env:
  EXTS: bcmath,ctype,curl,dom,exif,fileinfo,filter,gd,iconv,igbinary,intl,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,redis,session,simplexml,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib,apcu
  LIBS: libavif,nghttp2,nghttp3,ngtcp2,watcher,brotli
  IMAGE: dunglas/frankenphp:static-builder-musl

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: tools
        run: sudo apt-get install -y -qq moreutils >/dev/null
      - name: a demo Laravel app
        run: |
          set -euo pipefail
          composer create-project laravel/laravel demo --prefer-dist --no-interaction --quiet
          cd demo
          composer install --no-dev --optimize-autoloader --no-interaction --quiet
          sed -i 's/^APP_ENV=.*/APP_ENV=production/; s/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          php artisan config:clear
      - name: watch memory
        run: (while true; do free -m | awk '/Mem:/ {print $3}' >> /tmp/mem.log; sleep 2; done) &

      - name: the base, cached between runs
        id: base
        uses: actions/cache/restore@v4
        with:
          path: |
            spc
            gocache
            gomod
          key: frankenphp-base-v2-${{ hashFiles('.github/workflows/spike-frankenphp-static.yml') }}-v2
          restore-keys: frankenphp-base-v2-
      - name: the base (our CI, once per PHP version) - PHP + standard extensions, no app
        if: hashFiles('spc/link/xcaddy.cmd') == ''
        run: |
          set -euo pipefail
          mkdir -p spc gocache gomod out
          start=$(date +%s)
          docker run --rm -v "$PWD/spc:/go/src/app/dist/static-php-cli" \
            -v "$PWD/gocache:/root/.cache/go-build" -v "$PWD/gomod:/go/pkg/mod" \
            -e PHP_EXTENSIONS="$EXTS" -e PHP_EXTENSION_LIBS="$LIBS" "$IMAGE" ./build-static.sh > /tmp/base.log 2>&1 \
            || { tail -40 /tmp/base.log; echo "--- spc's own log"; sudo tail -60 spc/log/spc.output.log 2>/dev/null; exit 1; }
          tail -5 /tmp/base.log
          # how spc linked FrankenPHP: its env and its xcaddy command, so a
          # per-app build can run just that step
          sudo mkdir -p spc/link
          grep -a 'Setting env:' /tmp/base.log | sed 's/.*Setting env: //' | sudo tee spc/link/env.txt >/dev/null
          grep -a '\[EXEC\].*xcaddy build' /tmp/base.log | sed 's/.*\[EXEC\] *//' | tail -1 | sudo tee spc/link/xcaddy.cmd >/dev/null
          echo "--- env spc set ($(wc -l < spc/link/env.txt) lines):"; cut -c1-160 spc/link/env.txt
          echo "--- xcaddy:"; cut -c1-400 spc/link/xcaddy.cmd
          echo "BASE: $(( $(date +%s) - start ))s, libphp $(du -h spc/buildroot/lib/libphp.a | cut -f1), base dir $(sudo du -sh spc | cut -f1), go cache $(sudo du -sh gocache | cut -f1)"

      - name: keep the base for the next run
        if: steps.base.outputs.cache-hit != 'true' && hashFiles('spc/link/xcaddy.cmd') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            spc
            gocache
            gomod
          key: frankenphp-base-v2-${{ hashFiles('.github/workflows/spike-frankenphp-static.yml') }}-v2
      - name: per app (our builder's cap) - embed and link only, xcaddy directly
        run: |
          set -euo pipefail
          printf "\nRoute::get('/spike', fn () => 'rebuilt');\n" >> demo/routes/web.php
          cat > link.sh <<'SH'
          set -euo pipefail
          S=/go/src/app/dist/static-php-cli
          cd /go/src/app                                   # FrankenPHP's source
          # what --with-frankenphp-app does: the app as app.tar, and its md5
          tar -cf app.tar -C /app .
          md5sum app.tar | cut -d' ' -f1 > app.checksum
          echo "app.tar $(du -h app.tar | cut -f1)"
          export PATH=$S/pkgroot/x86_64-linux/go-xcaddy/bin:$S/pkgroot/x86_64-linux/bin:$S/buildroot/bin:$PATH
          export GOROOT=$S/pkgroot/x86_64-linux/go-xcaddy
          cd $S
          INC=$(./spc spc-config "$EXTS" --with-libs="$LIBS" --includes 2>/dev/null | tail -1)
          LNK=$(./spc spc-config "$EXTS" --with-libs="$LIBS" --libs 2>/dev/null | tail -1)
          LNK=$(tr ' ' '\n' <<<"$LNK" | grep -v ',' | tr '\n' ' ')   # spc-config echoes the lib list back
          echo "includes: ${INC:0:150}"; echo "libs: ${LNK:0:300}"
          DYN=$S/buildroot/lib/libphp.a.dynsym
          [[ -f $DYN ]] && DYNARG="-Wl,--dynamic-list=$DYN" || DYNARG=""
          export CGO_ENABLED=1
          export CGO_CFLAGS="$INC -fPIE -fstack-protector-strong -O2 -w -s -DFRANKENPHP_VERSION=1.12.7"
          export CGO_LDFLAGS="-static-pie $LNK"
          export LD_LIBRARY_PATH=$S/buildroot/lib
          export XCADDY_GO_BUILD_FLAGS="-buildmode=pie -ldflags \"-linkmode=external -extldflags '-static-pie -Wl,-z,stack-size=0x80000 $DYNARG' -X 'github.com/caddyserver/caddy/v2.CustomBinaryName=frankenphp'\" -tags=static_build,nobadger,nomysql,nopgx,deprecated_topic,deprecated_claim"
          cd $S/buildroot/lib
          rm -f frankenphp
          XC=$(sed 's/\x1b\[[0-9;]*m//g' $S/link/xcaddy.cmd)   # captured from a coloured log
          echo "running: ${XC:0:200}"
          eval "$XC"
          cp frankenphp /out/app
          SH
          : > /tmp/mem.log
          start=$(date +%s)
          docker run --rm --cpus=2 --memory=4g --memory-swap=4g \
            -v "$PWD/spc:/go/src/app/dist/static-php-cli" -v "$PWD/demo:/app:ro" -v "$PWD/out:/out" \
            -v "$PWD/gocache:/root/.cache/go-build" -v "$PWD/gomod:/go/pkg/mod" -v "$PWD/link.sh:/link.sh:ro" \
            -e EXTS -e LIBS "$IMAGE" bash /link.sh 2>&1 | grep -v '^\s*$' | tail -40
          [[ -f out/app ]] || { echo "no binary"; exit 1; }
          echo "PER-APP: $(( $(date +%s) - start ))s, peak $(sort -n /tmp/mem.log | tail -1) MB used, binary $(du -h out/app | cut -f1)"

      - name: run it like a deploy
        run: |
          set -euo pipefail
          cp out/app ./app && chmod +x ./app
          ./app version
          echo '<?php echo implode(" ", get_loaded_extensions()), "\n";' > /tmp/ext.php
          ./app php-cli /tmp/ext.php
          export LOG_CHANNEL=stderr DB_CONNECTION=sqlite DB_DATABASE=/tmp/app.sqlite
          export APP_KEY=$(grep '^APP_KEY=' demo/.env | cut -d= -f2-)
          touch /tmp/app.sqlite
          echo "--- release: php-cli artisan migrate --force"
          ./app php-cli artisan migrate --force 2>&1 | tail -8
          echo "--- worker: php-cli artisan queue:work --once"
          timeout 20 ./app php-cli artisan queue:work --once --stop-when-empty 2>&1 | tail -3 || true
          ( ./app php-server --listen 127.0.0.1:8080 > /tmp/server.log 2>&1 & )
          sleep 5
          echo "GET /      -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          echo "GET /spike -> $(curl -s http://127.0.0.1:8080/spike)"
          ps -o rss=,cmd= -C app | head -3
          grep -i error /tmp/server.log | tail -5 || true
