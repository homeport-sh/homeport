# SPIKE (not for main): can a Laravel app become one static FrankenPHP
# binary on builder-sized resources, and is a rebuild cheap once PHP itself
# is compiled? Measures wall time and peak memory of a cold build and of a
# rebuild that reuses static-php-cli's build cache, then runs the binary.
name: spike-frankenphp-static
on:
  push:
    branches: [spike/frankenphp-static]

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: a demo Laravel app
        run: |
          set -euo pipefail
          composer create-project laravel/laravel demo --prefer-dist --no-interaction --quiet
          cd demo
          composer install --no-dev --optimize-autoloader --no-interaction --quiet
          sed -i 's/^APP_ENV=.*/APP_ENV=production/; s/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          php artisan config:clear
          echo "app: $(du -sh . | cut -f1), $(find . -type f | wc -l) files"

      - name: watch memory
        run: |
          (while true; do free -m | awk '/Mem:/ {print $3}' >> /tmp/mem.log; sleep 2; done) &
          echo "machine: $(nproc) cpus, $(free -g | awk '/Mem:/ {print $2}') GB"

      - name: cold build (PHP + extensions compiled, app embedded)
        run: |
          set -euo pipefail
          mkdir -p cache out
          : > /tmp/mem.log
          start=$(date +%s)
          docker run --rm \
            -v "$PWD/demo:/go/src/app/dist/app" \
            -v "$PWD/cache:/go/src/app/dist/static-php-cli" \
            -v "$PWD/out:/out" \
            -e EMBED=dist/app/ \
            dunglas/frankenphp:static-builder-musl \
            sh -c './build-static.sh && cp dist/frankenphp-linux-* /out/' 2>&1 | tail -40
          echo "COLD: $(( $(date +%s) - start ))s, peak $(sort -n /tmp/mem.log | tail -1) MB used, binary $(du -h out/frankenphp-linux-* | cut -f1)"

      - name: rebuild after an app change (PHP cache reused)
        run: |
          set -euo pipefail
          echo "<?php Route::get('/spike', fn () => 'rebuilt');" >> demo/routes/web.php
          : > /tmp/mem.log
          start=$(date +%s)
          docker run --rm \
            -v "$PWD/demo:/go/src/app/dist/app" \
            -v "$PWD/cache:/go/src/app/dist/static-php-cli" \
            -v "$PWD/out:/out" \
            -e EMBED=dist/app/ \
            dunglas/frankenphp:static-builder-musl \
            sh -c './build-static.sh && cp dist/frankenphp-linux-* /out/' 2>&1 | tail -20
          echo "REBUILD: $(( $(date +%s) - start ))s, peak $(sort -n /tmp/mem.log | tail -1) MB used"

      - name: run it
        run: |
          set -euo pipefail
          cp out/frankenphp-linux-* ./app   # docker left it root-owned
          chmod +x ./app
          ./app version || true
          ( ./app php-server --listen 127.0.0.1:8080 > /tmp/server.log 2>&1 & )
          sleep 5
          echo "GET /      -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          echo "GET /spike -> $(curl -s http://127.0.0.1:8080/spike)"
          tail -20 /tmp/server.log
