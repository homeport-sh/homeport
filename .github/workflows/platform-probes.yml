# Checks the hosted platform refuses what it must — the things a green deploy
# does not prove. Manual only; each run exercises the real API with this run's
# OIDC tokens (no secrets). Tokens go to curl via stdin config, never argv.
#
#   negative: a replayed OIDC token → 403; an arm64 binary for an x86-64
#             box → 422 at /complete.
#   overlap:  two deploys of demo-app completed at the same instant → both go
#             live one after the other (deploying windows never overlap —
#             never an interleaved activate).
name: Platform probes

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  API: https://api.homeport.sh
  AUD: https://api.homeport.sh
  APP: demo-app

jobs:
  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1' # no checkout here, so no go.mod to read

      - name: probe
        run: |
          set -euo pipefail
          mint() {
            printf 'header = "Authorization: Bearer %s"\nurl = "%s&audience=%s"\n' \
              "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" "$AUD" \
              | curl -sSf --config - | jq -r .value
          }
          call() { # <token> <method> <path> [body] → "<body>\n<code>"
            { printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "$1"
              printf 'request = "%s"\nurl = "%s%s"\nwrite-out = "\\n%%{http_code}"\nsilent\n' "$2" "$API" "$3"
              if [ -n "${4:-}" ]; then printf 'data = "%s"\n' "${4//\"/\\\"}"; fi
            } | curl --config -
          }
          code() { printf '%s' "$1" | tail -n1; }
          body() { printf '%s' "$1" | sed '$d'; }
          fails=0
          expect() { # <label> <got> <want>
            if [ "$2" = "$3" ]; then echo "ok   $1 ($2)"; else echo "::error::$1: got $2, want $3"; fails=$((fails+1)); fi
          }
          open='{"app":"'"$APP"'"}'

          # replay: the first use spends the token's jti
          t1=$(mint)
          r=$(call "$t1" POST /v1/deployments "$open"); expect "fresh token opens a deployment" "$(code "$r")" 201
          r=$(call "$t1" POST /v1/deployments "$open"); expect "replayed token is refused" "$(code "$r")" 403

          # arm64 artifact for an x86-64 box
          t2=$(mint)
          r=$(call "$t2" POST /v1/deployments "$open"); expect "second deployment opens" "$(code "$r")" 201
          url=$(body "$r" | jq -r .upload_url); dep=$(body "$r" | jq -r .deployment_id); ct=$(body "$r" | jq -r .completion_token)
          mkdir -p /tmp/arm && cd /tmp/arm
          printf 'package main\nfunc main() {}\n' > main.go
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o app main.go
          head -c 20 app | od -An -tx1 | head -1
          up=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT --upload-file app "$url")
          expect "arm64 upload lands in the bucket" "$up" 200
          r=$(call "$ct" POST "/v1/deployments/$dep/complete"); expect "arm64 binary refused at /complete" "$(code "$r")" 422
          echo "reason: $(body "$r" | jq -r '.error // .')"
          [ "$fails" = 0 ]

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/tanstack-start
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bun --bun run build
          bun build --compile --bytecode --production --minify --sourcemap \
            --target=bun-linux-x64 --outfile dist/app .output/server/index.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: demo-app
          path: examples/tanstack-start/dist/app
          retention-days: 1

  overlap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: demo-app
      - name: two completes at the same instant
        run: |
          set -euo pipefail
          mint() {
            printf 'header = "Authorization: Bearer %s"\nurl = "%s&audience=%s"\n' \
              "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" "$AUD" \
              | curl -sSf --config - | jq -r .value
          }
          call() { # <token> <method> <path> [body] → "<body>\n<code>"
            { printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "$1"
              printf 'request = "%s"\nurl = "%s%s"\nwrite-out = "\\n%%{http_code}"\nsilent\n' "$2" "$API" "$3"
              if [ -n "${4:-}" ]; then printf 'data = "%s"\n' "${4//\"/\\\"}"; fi
            } | curl --config -
          }
          body() { printf '%s' "$1" | sed '$d'; }
          open='{"app":"'"$APP"'"}'
          # open + upload both first, so only the completes race
          for lane in a b; do
            r=$(call "$(mint)" POST /v1/deployments "$open")
            body "$r" > "open-$lane.json"
            curl -sSf -o /dev/null -X PUT --upload-file app "$(jq -r .upload_url "open-$lane.json")"
            echo "lane $lane: $(jq -r .deployment_id "open-$lane.json") uploaded"
          done
          complete() {
            call "$(jq -r .completion_token "open-$1.json")" POST "/v1/deployments/$(jq -r .deployment_id "open-$1.json")/complete" \
              | tail -n1 > "complete-$1.code"
          }
          complete a & complete b & wait
          echo "complete codes: a=$(cat complete-a.code) b=$(cat complete-b.code)"
          # Observe both lanes every 0.5s. M0 runs ONE sequential worker (a
          # deploy that meets the app lock is retried next tick), so the
          # correct outcome is both live with deploying windows that never
          # overlap — an interleaved activate is the failure.
          watch() { # <lane> → "<first-deploying-ms> <live-ms> <final> <detail>"
            local l=$1 i r st t start="" tok dep
            tok=$(jq -r .completion_token "open-$l.json"); dep=$(jq -r .deployment_id "open-$l.json")
            for i in $(seq 1 600); do
              r=$(call "$tok" GET "/v1/deployments/$dep"); st=$(body "$r" | jq -r .status); t=$(date +%s%3N)
              [ "$st" = deploying ] && [ -z "$start" ] && start=$t
              case $st in
                live) echo "${start:-$t} $t live -"; return;;
                failed) echo "${start:-$t} $t failed $(body "$r" | jq -r '.detail // "-"' | tr ' ' _)"; return;;
              esac
              sleep 0.5
            done
            echo "- - timeout -"
          }
          watch a > w-a & watch b > w-b & wait
          read -r sa la fa da < w-a; read -r sb lb fb db < w-b
          echo "lane a: $fa deploying $sa → done $la ($da)"
          echo "lane b: $fb deploying $sb → done $lb ($db)"
          [ "$fa" = live ] && [ "$fb" = live ] || { echo "::error::expected both live (serialized), got a=$fa b=$fb"; exit 1; }
          if [ "$la" -le "$sb" ] || [ "$lb" -le "$sa" ]; then
            echo "ok   both live, deploying windows disjoint (a: $sa–$la, b: $sb–$lb)"
          else
            echo "::error::deploying windows overlap — interleaved activate (a: $sa–$la, b: $sb–$lb)"; exit 1
          fi
