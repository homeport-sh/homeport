name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: bash syntax (bootstrap + embedded homeportd)
        run: |
          bash -n bootstrap/bootstrap.sh
          awk "/<<'HOMEPORTD_SCRIPT'/{f=1;next} /^HOMEPORTD_SCRIPT\$/{f=0} f" \
            bootstrap/bootstrap.sh | bash -n /dev/stdin

      - name: shellcheck (errors only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error bootstrap/bootstrap.sh

      - name: lint — no `local` reads a name it declares on the same line
        run: python3 test/lint_local_selfref.py bootstrap/bootstrap.sh

      - name: homeportd unit tests (bash 5 — runs the full suite incl. gateway)
        run: bash test/homeportd_test.sh

      # Behavioural origin-auth test against a real Caddy: what Caddy DOES with
      # the generated config (directive ordering decides whether a gateway path
      # or redirect alias skips the check — text assertions can't see that).
      - name: install caddy (pinned, checksum-verified)
        run: |
          v=2.11.4
          f=caddy_${v}_linux_amd64.tar.gz
          curl -fsSLo "$f" "https://github.com/caddyserver/caddy/releases/download/v$v/$f"
          echo "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  $f" | sha512sum -c -
          tar -xzf "$f" caddy && sudo install -m 755 caddy /usr/local/bin/caddy

      - name: origin-auth against real caddy
        run: REQUIRE_CADDY=1 bash test/caddy_origin_auth_test.sh

      # As root so the "another local user is refused" case runs too.
      - name: admin API off TCP, against real caddy
        run: sudo REQUIRE_CADDY=1 bash test/caddy_admin_test.sh

  # sandbox: gvisor, end to end on a real kernel: deploys a probe app through
  # homeportd and attacks the sandbox from inside. Its own job — it installs
  # homeportd and writes under /opt and /etc on the runner.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: install gVisor + tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq nftables iproute2 curl gnupg
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq runsc
          runsc --version | head -1
          # the runner's Docker sets the iptables FORWARD policy to DROP, which
          # a homeport box doesn't have; without this, sandbox egress can't leave
          sudo iptables -P FORWARD ACCEPT

      - name: env values reach the app exactly (real systemd, runs as root)
        run: sudo env "PATH=$PATH" REQUIRE_SYSTEMD=1 bash test/env_fidelity_test.sh

      - name: sandbox end to end (runs as root)
        run: sudo env "PATH=$PATH" REQUIRE_SANDBOX=1 bash test/sandbox_integration_test.sh

      - name: hosted builds end to end (runs as root)
        run: sudo env "PATH=$PATH" REQUIRE_SANDBOX=1 bash test/build_integration_test.sh
